[project]
name = "quilrai-assessment"
version = "0.1.0"
description = "QuilrAI assessment: MCP server, MCP security gateway, LLM streaming guardrail, rate-limiting model router"
requires-python = ">=3.11"
dependencies = [
    "mcp<2>=1.10",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["task1_mcp_server/tests", "task2_mcp_gateway/tests", "task3_llm_guardrail/tests", "task4_router/tests"]

[tool.setuptools]
packages = []
